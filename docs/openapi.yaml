    TicketInspection:
      description: One ticket and its direct relationship and hierarchy context from the same accepted board revision.
      type: object
      additionalProperties: false
      required: [board_id, board_revision, card, relationships, parent, children]
      properties:
        board_id:
          $ref: '#/components/schemas/Uuid'
        board_revision:
          allOf:
          - $ref: '#/components/schemas/Revision'
          - minimum: 1
        card:
          allOf:
          - $ref: '#/components/schemas/TicketCardContext'
          - required: [etag]
        relationships:
          type: array
          description: Direct links ordered by the other card's ticket, then kind and direction.
          items:
            type: object
            additionalProperties: false
            required: [id, kind, direction, card]
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              kind:
                type: string
                enum: [blocks, duplicates, references, relates_to]
              direction:
                type: string
                enum: [incoming, outgoing, symmetric]
                description: Direction relative to the selected card. Relates-to links are symmetric.
              card:
                $ref: '#/components/schemas/TicketCardContext'
        parent:
          anyOf:
          - $ref: '#/components/schemas/TicketCardContext'
          - type: 'null'
        children:
          type: array
          description: Direct children in ticket order.
          items:
            $ref: '#/components/schemas/TicketCardContext'
        prose:
          type: object
          description: Present only when include_prose is true. Contains only selected-card prose.
          additionalProperties: false
          required: [description, comments]
          properties:
            description:
              $ref: '#/components/schemas/Card/properties/description'
            comments:
              type: array
              description: Newest comments first, with newest commits breaking timestamp ties.
              items:
                $ref: '#/components/schemas/Comment'
