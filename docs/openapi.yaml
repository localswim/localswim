        Failed flush returns 503 and leaves the board open with publishing status available for inspection.
        A successful availability change commits one audited board revision. Board and policy metadata,
        the catalog, shared events, and authorized activity, publication, verification and snapshot
        inspection remain available. Operational requests on a closed or draining board return 503.
        Reopening validates the saved snapshot at the same board address and uses the current validator.
        Notification settings default off. Target changes preserve enabled state. Updating automatic
        publishing requires the board publish capability. Replacing user_ids requires workspace_admin
        and manage_permissions, validates all references, and refuses removing members needed by retained
