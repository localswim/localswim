x-contract-status: proposed; describes planned behavior, not implemented availability
x-input-policy:
  uuid: Normalize valid mixed-case UUIDv4 before validation, lookup, equality, and duplicate detection;
    emit lowercase hyphenated UUIDs.
  unknownMembers: Ignore harmless unknown members only in schemas with additionalProperties:true. Reject
    declared protected fields, ambiguous duplicates, invalid known types, and unknown fields in security-sensitive
    closed objects.
  text: Preserve case, whitespace and Unicode in user content. No global trimming or string-to-number/boolean
    coercion.
  headers: HTTP field names and auth-scheme spelling are case-insensitive. Capability bytes and opaque
    ETag bytes are exact.
  queries: Ignore unknown non-security query keys. Reject repeated scalar selectors and conflicting parameters.
    Normalize UUID array elements before duplicate checks.
x-security-policy:
  binding: 127.0.0.1 only; exact configured HTTP Host/authority on every request, including UI and bootstrap;
    ignore forwarded-host authority.
  origin: Reject foreign and null Origin before authentication or work. Originless native clients must
    authenticate. Only the exact configured origin is advertised by CORS.
  bootstrap: POST /browser-session alone is same-origin-only and unauthenticated, requires Origin plus
    Sec-Fetch-Site:same-origin, and returns only the runtime Human capability. No actor selector. Treat
    same-user local processes as trusted; this is not remote-user authentication.
  credentials: Separate random capabilities for Human and Bot, kept in page memory or private CLI runtime
    state, rotated on service replacement. No token in query, URL, log, Problem body, board snapshot,
    or user-supplied attribution.
  browser: Use authenticated fetch for SSE and attachment bytes, then blob URLs for previews/downloads.
    No credential-bearing EventSource URL.
  authorization: Capability principalId equals User.id. A board operation requires Board.userIds membership
    and its current Policy.resourceGrants capability. Creation/movement additionally require their lane
    grants. Collection reads return only authorized resources. Workspace management requires the runtime-issued
    workspaceAdmin flag; it never bypasses board mutation checks or Human-only approval. HTTP user configuration
    never issues or elevates capabilities.
  forbiddenResponseHeaders:
  - Access-Control-Allow-Credentials
  - Set-Cookie
  http: Plain HTTP is intentional for the bound local trust boundary. HSTS is not emitted. Invalid framing/duplicate
    security headers are rejected by the HTTP server before dispatch.
  cors: Same-origin-only by default. For accepted Origin requests, emit exact Access-Control-Allow-Origin
    and explicit exposed headers; otherwise omit grants. OPTIONS never grants a foreign origin. No wildcard
    and no credentialed cookie mode.
  fieldAuthorization:
    CardPatch:
      title: edit_card
      description: edit_card
      ownerId: edit_card
      parentId: manage_relationships
      laneId: matching moveGrants edge
      priorityId: set_priority
      archived: archive_card
      coverAttachmentId: manage_attachments
    BoardPatch:
      name: manage_board
      userCss: manage_board
      notifications: manage_notifications
      publishing: publish
      availability: close_board
      userIds: manage_permissions plus workspaceAdmin
  bootstrapDefaults: The local runtime issues bootstrap identities and workspaceAdmin capabilities to
    the configured local owner Human and CLI Bot. Fresh default boards contain those users with read/edit/comment/relationship/attachment/priority/workflow/management/backup/restore/publishing
    capabilities, lane grants from the default workflow, and approve only for Human. Custom board creation
    must provide explicit resourceGrants and lane grants.
x-ui-response-headers:
  Content-Security-Policy: 'default-src ''none''; script-src ''self''; style-src ''self''; img-src ''self''
    data: blob:; connect-src ''self''; font-src ''self''; object-src ''none''; base-uri ''none''; frame-ancestors
    ''none''; form-action ''self'''
  X-Content-Type-Options: nosniff
  Referrer-Policy: no-referrer
  Cross-Origin-Opener-Policy: same-origin
  Cross-Origin-Resource-Policy: same-origin
  Permissions-Policy: camera=(), microphone=(), geolocation=()
  Cache-Control: no-store
x-runtime-requirements:
  maxJsonBytes: 100663296
  maxAttachmentBytes: 10485760
  maxMultipartBytes: 10747904
  uncertainWrites: A timeout, truncated/unreadable successful response, or mutation 5xx can follow commit.
    Inspect the resource/result and never automatically replay. Emit canonical validated outcomes and
    distinguish known refusals.
  headers: Required Header Objects declare the published presence contract. Origin-dependent CORS fields
    are conditional. Content-Type is described by response content, not a duplicate ignored header. HTTP
    framing headers are server-owned.
  schemaLimits: OpenAPI describes messages and security schemes. It cannot by itself enforce Host/Origin
    checks, CORS header absence, duplicate JSON detection, transaction atomicity, graph rules, or runtime
    bounds. x-* policies are normative implementation requirements and need server tests.
  identity: Entity UUIDs never change. Board-local lane/priority keys and human card ticket numbers are
    separate properties. Derived snapshot/verification/ticket-order singleton views are addressed by their
    owner's UUID and allocate no new entity ID.
  fullRelease: Expose a documented route only when implemented; all39 planned milestones are mapped by
    x-milestones. Resource field nullability and closed output shapes are contractual.
  mutableKeys: M20 changes Lane.key, never Lane.id. The completed semantic role is protected independently
    of labels and keys.
  responseBounds: Collections page at 200 items. Complete snapshots and mutation fan-out use the inclusive
    96 MiB JSON response bound. Prepare and validate mutation results before commit; a result that cannot
    fit refuses before mutation instead of truncating committed changes.
  catalogEvents: Every committed edit affecting catalog counts, labels, availability, or recency updates
    catalogEtag and reaches every workspace event stream, even if that board is not selected/watched.
    workspaceEtag changes only with workspace preferences.
  restoreUsers: Board recovery never overwrites an existing global User. Every referenced user UUID must
    already exist and have the same immutable kind; otherwise refuse with 409 before mutation. Current
    global labels/colors remain current, even when an older snapshot contains earlier display metadata.
    Snapshot metadata remains historical evidence. Creating missing global users requires the separate
    workspace-admin user operation.
x-notification-worker:
  trigger: Only committed, actual Human card edits while the board setting is enabled.
  quietSeconds: 15
  payload: Board identity/label, edit interval, and bounded ticket numbers only. No card prose or credentials.
  destination: Read the current target at delivery. Target-only updates preserve enablement.
  delivery: One native codex queue attempt per quiet burst. No durable cursor, catch-up, or retries. A
    pending burst can be lost at shutdown.
  isolation: Queue failure never changes a committed product operation. Bot-only edits and no-ops create
    no owner notice.
x-publishing-worker:
  trigger: Opt-in board edit or enabled workspace preference edit, after a five-second quiet period.
  capture: Capture a coherent immutable board/attachment or preference snapshot. Git runs outside command
    admission.
  synchronization: Serialize every board and workspace publisher sharing one repository with the same
    persistent OS lock.
  retry: Retain failed pushes as pending and retry with bounded backoff even without another edit. Preserve
    already committed history and unrelated staged work.
  shutdown: Flush enabled publishers before successful explicit shutdown. A failed final push leaves the
    service available with failure status.
