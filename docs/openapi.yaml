        absent.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: RFC 9110 entity-tag list for this request target. At least one strong tag must match.
        Weak tags and * do not satisfy a write precondition. Missing returns 428; stale returns 412. Optional
        whitespace follows HTTP grammar.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: RFC 9110 cache validation, including weak tags and *. A match on GET/HEAD returns 304
        without content.
    ExpectedBoardEtag:
      name: X-Expected-Board-ETag
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/EntityTag'
      description: Additional board precondition for relationship/attachment removal spanning related
        records. This explicitly names the board, independently of If-Match on the target resource.
