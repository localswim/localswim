openapi: 3.2.1
info:
  title: Localswim V2 API
  version: '2026-11-10'
  summary: Flat resources for the local board workspace
  description: Proposed full-release contract for the fresh Go implementation. The date in the URL identifies
    the API contract, independently of software builds and resource revisions. Schemas describe the complete
    planned surface; they do not claim that endpoints are already implemented. Outputs are closed and
    canonical. Ordinary input ignores unknown harmless members, accepts mixed-case UUIDv4 and documented
    case-insensitive enums, and retains user text exactly. Ambiguous JSON, protected attribution, invalid
    types, and unauthorized operations are refused. Collection responses use their plural resource name
    for the array, including activities for either activity view and boards for workspace summaries.
    Empty collections return an empty array. The next_cursor field retains its pagination meaning.
    JSON member names, path parameter identifiers, and query parameter names use snake_case.
    Standard HTTP header names retain their standard spelling. Values retain their defined spelling.
servers:
- url: /api/2026-11-10
  description: Same origin as the local UI. The service binds only to 127.0.0.1 at its configured port.
security:
- localBearer: []
tags:
- name: Workspace
- name: Boards
- name: Cards
- name: Comments
- name: Relationships
- name: Workflow
- name: Attachments
- name: Activity
- name: Review
- name: Recovery
- name: Publishing
- name: Service
paths:
  /browser-session:
    post:
      operationId: bootstrapBrowser
      summary: Obtain the local Human browser session
      tags:
      - Workspace
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Sec-Fetch-Site
        in: header
        required: true
        schema:
          const: same-origin
      responses:
        '200':
          description: Success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              required: true
              schema:
                const: no-store
              description: Cache policy for this response.
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/ResourcePolicy'
            Content-Security-Policy:
              $ref: '#/components/headers/ApiCsp'
            Vary:
              $ref: '#/components/headers/Vary'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsOrigin'
            Access-Control-Expose-Headers:
              $ref: '#/components/headers/CorsExpose'
            Date:
              $ref: '#/components/headers/Date'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
      x-authorization: same-origin browser bootstrap
      x-milestones: []
      description: 'No bearer is required for this bootstrap only. Exact Host and Origin plus Sec-Fetch-Site:
        same-origin are required. The service supplies only the runtime Human capability; no requested
        identity is accepted. Keep this token in page memory, not browser persistent storage.'
      security: []
    options:
      operationId: options_browser_session
      summary: Validate same-origin preflight
      tags:
      - Workspace
      security: []
      parameters:
      - name: Origin
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Access-Control-Request-Method
        in: header
        required: false
        schema:
          type: string
          pattern: ^(?:[pP][oO][sS][tT])$
          description: ASCII case-insensitive input. Responses use the documented lowercase spelling.
      - name: Access-Control-Request-Headers
        in: header
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 1024
      responses:
        '204':
          description: Allowed same-origin preflight. No credentials or resource content.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              required: true
              schema:
                const: no-store
              description: Cache policy for this response.
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Referrer-Policy:
              $ref: '#/components/headers/ReferrerPolicy'
            Cross-Origin-Resource-Policy:
              $ref: '#/components/headers/ResourcePolicy'
            Content-Security-Policy:
              $ref: '#/components/headers/ApiCsp'
            Vary:
              required: true
              schema:
                const: Origin, Access-Control-Request-Method, Access-Control-Request-Headers
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsOrigin'
            Access-Control-Expose-Headers:
              $ref: '#/components/headers/CorsExpose'
            Access-Control-Allow-Methods:
              required: true
              schema:
                const: POST, OPTIONS
            Access-Control-Allow-Headers:
              required: true
              schema:
                const: Authorization, Content-Type, If-Match, If-None-Match, X-Expected-Board-ETag, X-Request-ID
            Access-Control-Max-Age:
              required: true
              schema:
                const: '600'
            Allow:
              required: true
              schema:
                const: POST, OPTIONS
            Date:
              $ref: '#/components/headers/Date'
        '400':
          $ref: '#/components/responses/BadRequest2'
        '403':
          $ref: '#/components/responses/Forbidden2'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
      description: Case-insensitive requested header names are tokenized and compared to the explicit
        list. Unknown actual request headers may be ignored, but preflight never advertises unapproved
        security-sensitive headers. Non-preflight OPTIONS returns Allow without granting cross-origin
        access. A preflight requires both Origin and Access-Control-Request-Method. Ordinary OPTIONS may
        omit both.
