<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>localswim</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.mjs"></script>
</head>
<body>
  <header><a href="/">localswim</a><span id="identity"></span></header>
  <p id="status" role="status" aria-live="polite" data-phase="loading">Connecting…</p>
  <button id="refresh" type="button">Refresh</button>
  <div class="layout">
    <div id="board-sidebar">
      <button id="toggle-board-sidebar" type="button" aria-controls="boards" aria-expanded="true" hidden>Hide Attention</button>
      <div id="resize-board-sidebar" role="separator" tabindex="0" aria-label="Attention width"
           aria-orientation="vertical" aria-controls="boards" hidden></div>
      <nav aria-label="Boards" id="boards"></nav>
    </div>
    <main id="main"></main>
    <aside id="details" aria-label="Card details" hidden></aside>
  </div>
</body>
</html>
