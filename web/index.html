<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>localswim</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div data-app data-phase="loading">
    <header id="app-bar">
      <a href="/" aria-label="localswim home">localswim</a>
      <h1 id="board-name" hidden></h1>
    </header>
    <main id="main">
      <div id="workspace-layout">
        <div id="attention"></div>
        <div id="board-region" hidden>
          <p id="status" role="status" data-phase="loading">Loading…</p>
          <div id="route-content"></div>
        </div>
      </div>
      <noscript>Enable JavaScript to open your boards.</noscript>
    </main>
  </div>
</body>
</html>
